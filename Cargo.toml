[package]
name = "omnisql"
version = "1.0.3"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
regex = "1.10"
wasmtime = "25"
wasmtime-wasi = "25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower-lsp = "0.20.0"
tokio = { version = "1.53.1", features = ["full"] }
sqlparser = "0.63.0"
