name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plat: linux
            arch: x86_64
            bin_name: omnisql
          - os: macos-latest
            target: x86_64-apple-darwin
            plat: macos
            arch: x86_64
            bin_name: omnisql
          - os: macos-latest
            target: aarch64-apple-darwin
            plat: macos
            arch: aarch64
            bin_name: omnisql
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            plat: windows
            arch: x86_64
            bin_name: omnisql.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package for Linux / macOS
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.tar.gz ${{ matrix.bin_name }}

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.zip

      - name: Upload artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.tar.gz
          path: target/${{ matrix.target }}/release/omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.zip
          path: target/${{ matrix.target }}/release/omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: omnisql-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

  publish-npm:
    name: Publish to NPM
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
        working-directory: ./npm
      - run: npm publish
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
        working-directory: ./python
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
        working-directory: ./python

  publish-vscode:
    name: Publish VS Code Extension
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - run: npm ci
        working-directory: ./vscode-extension
      - run: npm install -g @vscode/vsce
      - run: vsce publish
        working-directory: ./vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
