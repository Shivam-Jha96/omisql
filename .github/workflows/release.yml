name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plat: linux
            arch: x86_64
            bin_name: omnisql
          - os: macos-latest
            target: x86_64-apple-darwin
            plat: macos
            arch: x86_64
            bin_name: omnisql
          - os: macos-latest
            target: aarch64-apple-darwin
            plat: macos
            arch: aarch64
            bin_name: omnisql
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            plat: windows
            arch: x86_64
            bin_name: omnisql.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package for Linux / macOS
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.tar.gz ${{ matrix.bin_name }}

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.zip

      - name: Upload artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.tar.gz
          path: target/${{ matrix.target }}/release/omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.zip
          path: target/${{ matrix.target }}/release/omnisql-${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.plat }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
